# ============================================================================
# Azure Pipelines Documentation Publish Template
# ============================================================================
#
# Purpose: Build MkDocs Material site and publish to gh-pages
# Called by: azure-pipelines.yml (Publication stage)
# ============================================================================

parameters:
  - name: displayName
    type: string
    default: "Publish Documentation Site"

jobs:
  - job: PublishDocs
    displayName: ${{ parameters.displayName }}
    pool:
      name: Default
    steps:
      - checkout: self
        persistCredentials: true

      - task: UsePythonVersion@0
        inputs:
          versionSpec: '3.x'
          addToPath: true

      - script: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          mkdocs build --strict
        displayName: 'Install dependencies and build MkDocs site'

      - script: |
          git config user.name "azure-pipelines[bot]"
          git config user.email "azure-pipelines[bot]@users.noreply.github.com"
          pip install ghp-import
          ghp-import -n -p -f site
        displayName: 'Publish site to gh-pages branch'
        condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['Build.SourceBranch'], 'refs/heads/master')))
